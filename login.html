<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071625">
    <title>Login | Anas Musa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="login-page-compact">
    <main class="login-shell" aria-labelledby="login-title">
        <h1 id="login-title">Login</h1>
        <p class="login-subtitle">Enter your email and Password to access your account.</p>

        <form id="loginForm" class="login-form" novalidate>
            <div class="input-field">
                <span class="field-icon"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="loginEmail" name="email" placeholder="Email address" autocomplete="username" required>
            </div>

            <div class="input-field password-field">
                <span class="field-icon"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="loginPassword" name="password" placeholder="Password" autocomplete="current-password" required>
                <button type="button" class="toggle-password" aria-label="Show password">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>

            <div class="options-row">
                <label class="remember-me" for="rememberMe">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="text-link">Forgot password?</a>
            </div>

            <button type="submit" class="primary-login-btn">
                <span>Login</span>
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>

            <p id="loginNotice" class="login-notice" role="status" aria-live="polite"></p>

            <div class="divider" aria-hidden="true">
                <span></span>
                <strong>or</strong>
                <span></span>
            </div>

            <div class="social-actions">
                <button type="button" class="social-btn google-btn" aria-label="Continue with Google">
                    <span class="google-mark">G</span>
                    <span>Continue with Google</span>
                </button>

                <button type="button" class="social-btn github-btn" aria-label="Continue with GitHub">
                    <i class="fa-brands fa-github"></i>
                    <span>Continue with GitHub</span>
                </button>
            </div>

            <p class="legal-copy">
                By continuing,you agree to our<br>
                <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </p>
        </form>
    </main>

    <script src="script.js"></script>
    <script type="module" src="firebase-auth.js"></script>
</body>

</html>
